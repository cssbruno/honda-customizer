name: Validate Honda Customizer release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: honda-customizer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          # The default includes the retired SDK package "tools".
          packages: platform-tools
      - name: Install compile SDK and build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Validate smoke-result parser
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Test, lint and build release APK
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease --no-daemon --console=plain
      - name: Explain validation APK signing
        if: always()
        run: |
          echo '### Honda Customizer validation artifacts' >> "$GITHUB_STEP_SUMMARY"
          echo 'These CI APKs use the runner-generated development certificate for build validation. They are not update-compatible distribution builds and are not published as a release.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: honda-customizer-reports-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            app/build/reports/**
            app/build/test-results/**
      - name: Upload CI validation APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: honda-customizer-ci-only-apks-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            app/build/outputs/apk/release/*.apk
